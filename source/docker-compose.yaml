    volumes:
    - superset-home:/app/superset_home
    entrypoint:
    - /bin/sh
    - -c
    command: 'superset db upgrade && (superset fab create-admin --username "$${SUPERSET_ADMIN_USERNAME}"
      --firstname Superset --lastname Admin --email "$${SUPERSET_ADMIN_EMAIL}" --password
