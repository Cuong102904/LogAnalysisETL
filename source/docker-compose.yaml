name: log-streaming-platform
services:
  # ── Core Infrastructure ──────────────────────────────────────────────
  broker1:
    build:
      context: ./platform/local/kafka
      dockerfile: Dockerfile
    image: local/kafka:dev
    hostname: broker1
    container_name: lsp-broker1
    ports:
    - 9092:9092
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9101,2@broker2:9101,3@broker3:9101
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9101
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
    - broker1-data:/var/lib/kafka/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server broker1:29092 >/dev/null 2>&1
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  broker2:
    build:
      context: ./platform/local/kafka
      dockerfile: Dockerfile
    image: local/kafka:dev
    hostname: broker2
    container_name: lsp-broker2
    ports:
    - 9093:9093
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9101,2@broker2:9101,3@broker3:9101
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9101
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
    - broker2-data:/var/lib/kafka/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server broker2:29092 >/dev/null 2>&1
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  broker3:
    build:
      context: ./platform/local/kafka
      dockerfile: Dockerfile
    image: local/kafka:dev
    hostname: broker3
    container_name: lsp-broker3
    ports:
    - 9094:9094
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9101,2@broker2:9101,3@broker3:9101
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9101
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
    - broker3-data:/var/lib/kafka/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server broker3:29092 >/dev/null 2>&1
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  minio:
    build:
      context: ./platform/local/minio
      dockerfile: Dockerfile
    image: local/minio:dev
    container_name: lsp-minio
    command: server --console-address ":9001" /data
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    volumes:
    - minio-data:/data
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://minio:9000/minio/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  hive-metastore:
    build:
      context: ./platform/local/hive-metastore
      dockerfile: Dockerfile
    image: local/hive-metastore:dev
    container_name: lsp-hive-metastore
    user: root
    environment:
      SERVICE_NAME: metastore
    ports:
    - 9083:9083
    volumes:
    - hive-metastore-data:/opt/hive/data
    command:
    - bash
    - -lc
    - |
      set -e
      cd /opt/hive/data
      if ! /opt/hive/bin/schematool -dbType derby -info >/dev/null 2>&1; then
        /opt/hive/bin/schematool -dbType derby -initSchema
      fi
      export METASTORE_PORT=9083
      exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
    restart: 'no'
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - bash -lc 'echo > /dev/tcp/localhost/9083'
      interval: 10s
      timeout: 5s
      retries: 30
  spark-master:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-spark-master
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_BIND_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      # OpenLineage disabled for local/dev. Enable in production by setting
      # `OPENLINEAGE_ENABLED: 'true'` in the service environment.
      OPENLINEAGE_ENABLED: 'false'
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 768m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      SPARK_MODE: master
      SPARK_PUBLIC_DNS: ${SPARK_MASTER_ADVERTISE_HOST:-100.120.19.23}
    ports:
    - 7077:7077
    - 8081:8080
    mem_limit: 512m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://spark-master:8080 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  spark-worker-1:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      # OpenLineage disabled for local/dev. Enable in production by setting
      # `OPENLINEAGE_ENABLED: 'true'` in the service environment.
      OPENLINEAGE_ENABLED: 'false'
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 768m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      SPARK_MODE: worker
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
    ports:
    - 8082:8081
    mem_limit: 4096m
  spark-worker-2:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-spark-worker-2
    profiles:
    - local-workers
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      # OpenLineage disabled for local/dev. Enable in production by setting
      # `OPENLINEAGE_ENABLED: 'true'` in the service environment.
      OPENLINEAGE_ENABLED: 'false'
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 768m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      SPARK_MODE: worker
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
    ports:
    - 8083:8081
    mem_limit: 4096m
  # ── Kafka Topic Bootstrap (run-once) ───────────────────────────────
  kafka-init:
    build:
      context: ./platform/local/kafka
      dockerfile: Dockerfile
    image: local/kafka:dev
    container_name: lsp-kafka-init
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVER: broker1:29092
    volumes:
    - ./platform/local/kafka/scripts:/scripts:ro
    entrypoint:
    - /bin/bash
    - -lc
    command: /scripts/create_topics.sh
    restart: 'no'
    mem_limit: 256m
  # ── MinIO Bucket Bootstrap (run-once) ──────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: lsp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DATA: ${MINIO_BUCKET_DATA:-lakehouse}
      MINIO_BUCKET_PLATFORM: ${MINIO_BUCKET_PLATFORM:-platform}
    entrypoint:
    - /bin/sh
    - -c
    - 'set -e

      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"

      mc mb --ignore-existing "local/$${MINIO_BUCKET_DATA}"

      mc mb --ignore-existing "local/$${MINIO_BUCKET_PLATFORM}"

      touch /tmp/spark-events-log-keep

      mc cp /tmp/spark-events-log-keep "local/$${MINIO_BUCKET_PLATFORM}/spark-events/logs/.keep"

      mc anonymous set download "local/$${MINIO_BUCKET_DATA}" || true

      '
    mem_limit: 192m
  # ── Streaming Pipelines ─────────────────────────────────────────────
  bronze-stream:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-bronze-stream
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      # OpenLineage disabled for local/dev. Enable in production by setting
      # `OPENLINEAGE_ENABLED: 'true'` in the service environment.
      OPENLINEAGE_ENABLED: 'false'
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 1024m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      BRONZE_APP_NAME: ${BRONZE_APP_NAME:-learnlake_bronze_ingestion}
      SPARK_UI_PORT: 4040
      BRONZE_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:-broker1:29092,broker2:29092,broker3:29092}
      BRONZE_STARTING_OFFSETS: ${BRONZE_STARTING_OFFSETS:-earliest}
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER:-1000}
      BRONZE_TRIGGER_PROCESSING_TIME: ${BRONZE_TRIGGER_PROCESSING_TIME:-5 seconds}
    command:
    - /opt/project/platform/local/spark/scripts/run_bronze_stream.sh
    ports:
    - 4040:4040
    restart: unless-stopped
    mem_limit: 1536m
  silver-stream:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-silver-stream
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      bronze-stream:
        condition: service_started
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      # OpenLineage disabled for local/dev. Enable in production by setting
      # `OPENLINEAGE_ENABLED: 'true'` in the service environment.
      OPENLINEAGE_ENABLED: 'false'
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 768m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      SILVER_APP_NAME: ${SILVER_APP_NAME:-learnlake_silver_normalization}
      SPARK_UI_PORT: 4041
    command:
    - /opt/project/platform/local/spark/scripts/run_silver_stream.sh
    ports:
    - 4041:4041
    restart: unless-stopped
    mem_limit: 768m
  gold-stream:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-gold-stream
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      silver-stream:
        condition: service_started
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      # OpenLineage disabled for local/dev. Enable in production by setting
      # `OPENLINEAGE_ENABLED: 'true'` in the service environment.
      OPENLINEAGE_ENABLED: 'false'
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 1024m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      GOLD_APP_NAME: ${GOLD_APP_NAME:-gold_aggregator}
      SPARK_UI_PORT: 4042
    command:
    - /opt/project/platform/local/spark/scripts/run_gold_stream.sh
    ports:
    - 4042:4042
    restart: unless-stopped
    mem_limit: 1536m
  gold-alert-stream:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-gold-alert-stream
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      gold-stream:
        condition: service_started
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 1024m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      GOLD_ALERTING_APP_NAME: ${GOLD_ALERTING_APP_NAME:-gold_alerting}
      SPARK_UI_PORT: 4043
    command:
    - /opt/project/platform/local/spark/scripts/run_gold_alert_stream.sh
    ports:
    - 4043:4043
    restart: unless-stopped
    mem_limit: 1536m
  # ── Batch / Replay Utilities (run-once) ────────────────────────────
  gold-batch:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    container_name: lsp-gold-batch
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      silver-stream:
        condition: service_started
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 1024m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
      GOLD_BATCH_APP_NAME: ${GOLD_BATCH_APP_NAME:-gold_dashboard_serving_batch}
      SPARK_UI_PORT: 4044
    command:
    - /opt/project/platform/local/spark/scripts/run_gold_batch.sh
    ports:
    - 4044:4044
    restart: 'no'
    mem_limit: 1536m
  # ── Replay Smoke Test (run-once) ───────────────────────────────────
  tracking-log-replayer:
    build:
      context: .
      dockerfile: platform/local/spark/Dockerfile
    image: local/spark:dev
    profiles:
    - replay
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      bronze-stream:
        condition: service_started
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_ADVERTISE_HOST:-spark-master}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_APP_PATH: /opt/project
      SPARK_CONF_DIR: /opt/bitnami/spark/conf
      PYTHONPATH: /opt/project/src:/opt/project
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-learnlake-local}
      OPENLINEAGE_TRANSPORT_TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-http}
      OPENLINEAGE_TRANSPORT_URL: ${OPENLINEAGE_TRANSPORT_URL:-http://marquez-api:5000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      S3A_PATH_STYLE_ACCESS: 'true'
      S3A_SSL_ENABLED: 'false'
      SPARK_DRIVER_MEMORY: 768m
      SPARK_EXECUTOR_MEMORY: 1g
      PYSPARK_PYTHON: /opt/bitnami/python/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/bitnami/python/bin/python
    command:
    - /opt/bitnami/python/bin/python
    - -m
    - apps.replay.replay_to_kafka
    - --source
    - daotao_ai
    - --input
    - /data/activity_logs
    - --brokers
    - broker1:29092,broker2:29092,broker3:29092
    - --speed
    - '100'
    - --skip-decode-errors
    volumes:
    - /home/cuong/Desktop/DATN/BK_activity_logs_unzipped:/data/activity_logs:ro
    restart: 'no'
    mem_limit: 512m
    container_name: lsp-tracking-log-replayer
  # ── Query / BI Layer ────────────────────────────────────────────────
  trino:
    build:
      context: ./serving/trino
      dockerfile: Dockerfile
    image: local/trino:dev
    container_name: lsp-trino
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
    - 8080:8080
    volumes:
    - trino-data:/data/trino
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://trino:8080/v1/info >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  # ── Trino Semantic Bootstrap (run-once) ────────────────────────────
  trino-bootstrap:
    image: python:3.11-slim
    container_name: lsp-trino-bootstrap
    depends_on:
      hive-metastore:
        condition: service_healthy
      trino:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
    - ./serving/trino/bootstrap:/bootstrap:ro
    - ./serving/trino/views:/views:ro
    command:
    - python
    - /bootstrap/bootstrap_trino.py
    restart: 'no'
    mem_limit: 256m
  # ── Superset Initialization (run-once) ─────────────────────────────
  superset-init:
    build:
      context: ./serving/superset
      dockerfile: Dockerfile
    image: local/superset:dev
    container_name: lsp-superset-init
    depends_on:
      trino:
        condition: service_started
    environment:
      PYTHONPATH: /app/pythonpath
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-superset_admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_TRINO_SQLALCHEMY_URI: ${SUPERSET_TRINO_SQLALCHEMY_URI:-trino://superset@trino:8080/delta/mooc}
    volumes:
    - superset-home:/app/superset_home
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      superset db upgrade
      superset fab create-admin --username "$SUPERSET_ADMIN_USERNAME" --firstname Superset --lastname Admin --email "$SUPERSET_ADMIN_EMAIL" --password "$SUPERSET_ADMIN_PASSWORD" || true
      superset fab reset-password --username "$SUPERSET_ADMIN_USERNAME" --password "$SUPERSET_ADMIN_PASSWORD"
      superset init
    restart: 'no'
    mem_limit: 512m
  superset:
    build:
      context: ./serving/superset
      dockerfile: Dockerfile
    image: local/superset:dev
    container_name: lsp-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_started
    environment:
      PYTHONPATH: /app/pythonpath
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-superset_admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_TRINO_SQLALCHEMY_URI: ${SUPERSET_TRINO_SQLALCHEMY_URI:-trino://superset@trino:8080/delta/mooc}
    volumes:
    - superset-home:/app/superset_home
    ports:
    - 8088:8088
    command:
    - sh
    - -c
    - superset run -h 0.0.0.0 -p 8088
    restart: unless-stopped
    mem_limit: 768m
  # ── Superset Bootstrap (run-once) ──────────────────────────────────
  superset-bootstrap:
    image: python:3.11-slim
    container_name: lsp-superset-bootstrap
    depends_on:
      superset:
        condition: service_started
      trino:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/pythonpath
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-superset_admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_TRINO_SQLALCHEMY_URI: ${SUPERSET_TRINO_SQLALCHEMY_URI:-trino://superset@trino:8080/delta/mooc}
    volumes:
    - ./serving/superset/bootstrap:/bootstrap:ro
    command:
    - python
    - /bootstrap/bootstrap_superset.py
    restart: 'no'
    mem_limit: 256m
  # ── Optional Tooling / Observability ────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lsp-kafka-ui
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
    ports:
    - 8085:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1:29092,broker2:29092,broker3:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    mem_limit: 300m
  marquez-db:
    image: postgres:14
    container_name: lsp-marquez-db
    hostname: postgres
    profiles:
    - lineage
    environment:
      POSTGRES_DB: ${MARQUEZ_DB:-marquez}
      POSTGRES_USER: ${MARQUEZ_POSTGRES_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_POSTGRES_PASSWORD}
      MARQUEZ_DB: ${MARQUEZ_DB:-marquez}
      MARQUEZ_USER: ${MARQUEZ_USER:-marquez}
      MARQUEZ_PASSWORD: ${MARQUEZ_PASSWORD}
    ports:
    - ${MARQUEZ_DB_HOST_PORT:-15432}:5432
    volumes:
    - marquez-db-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
        - postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${MARQUEZ_POSTGRES_USER:-postgres} -d ${MARQUEZ_DB:-marquez}
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
  marquez-api:
    image: marquezproject/marquez:${MARQUEZ_TAG:-0.49.0}
    container_name: lsp-marquez-api
    profiles:
    - lineage
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: ${MARQUEZ_API_PORT:-5000}
      MARQUEZ_ADMIN_PORT: ${MARQUEZ_ADMIN_PORT:-5001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${MARQUEZ_DB_PORT:-5432}
      SEARCH_ENABLED: ${MARQUEZ_SEARCH_ENABLED:-false}
    ports:
    - ${MARQUEZ_API_PORT:-5000}:5000
    - ${MARQUEZ_ADMIN_PORT:-5001}:5001
    volumes:
    - marquez-api-data:/opt/marquez
    entrypoint:
    - /bin/bash
    - -lc
    - "until (echo >/dev/tcp/postgres/${MARQUEZ_DB_PORT:-5432}) >/dev/null 2>&1; do\n\
      \  sleep 1\ndone\nexec ./entrypoint.sh\n"
    restart: unless-stopped
    mem_limit: 768m
  marquez-web:
    image: marquezproject/marquez-web:${MARQUEZ_TAG:-0.49.0}
    container_name: lsp-marquez-web
    profiles:
    - lineage
    depends_on:
      marquez-api:
        condition: service_started
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: ${MARQUEZ_API_PORT:-5000}
      WEB_PORT: ${MARQUEZ_WEB_PORT:-3000}
      REACT_APP_ADVANCED_SEARCH: ${MARQUEZ_SEARCH_ENABLED:-false}
    ports:
    - ${MARQUEZ_WEB_PORT:-3000}:3000
    restart: unless-stopped
    mem_limit: 384m
volumes:
  broker1-data: null
  broker2-data: null
  broker3-data: null
  minio-data: null
  hive-metastore-data: null
  trino-data: null
  superset-home: null
  marquez-db-data: null
  marquez-api-data: null
