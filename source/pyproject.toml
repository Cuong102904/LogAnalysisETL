[project]
name = "datn-source-runtime"
version = "0.1.0"
description = "Shared Python runtime for source modules"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "apache-airflow>=2.10.0",
    "confluent-kafka>=2.3.0",
    "delta-spark>=3.2.0",
    "pydantic>=2.0.0",
    "pyarrow>=15.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pyspark>=3.5.0",
    "pyyaml>=6.0.0",
    "trino>=0.330.0",
    "apache-airflow-providers-apache-spark>=6.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
extraPaths = ["spark"]
