[project]
name = "kafka-producer-lab"
version = "0.1.0"
description = "Local Kafka lab: Python producer with confluent-kafka"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["producer", "event_classifier"]
