[project]
name = "lsp-producer"
version = "0.1.0"
description = "Producer replay logs into Kafka for log-streaming-platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["producer"]

