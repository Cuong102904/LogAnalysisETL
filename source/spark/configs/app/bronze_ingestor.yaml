app_name: bronze_ingestor
kafka:
  bootstrap_servers: broker1:29092,broker2:29092,broker3:29092
  input_topic: mooc.raw.events
  dlq_topic: mooc.dlq.events
  starting_offsets: latest
  consumer_group_id: bronze_ingestor
  consumer_client_id: bronze_ingestor_worker
storage:
  table_path: s3a://bronze/mooc/bronze/mooc_events_raw
  checkpoint_path: s3a://checkpoints/mooc/bronze_ingestor
streaming:
  query_name: bronze_ingestor_raw
options:
  fanout_enabled: false
