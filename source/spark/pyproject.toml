[project]
name = "lsp-spark-jobs"
version = "0.1.0"
description = "PySpark jobs for log-streaming-platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["jobs"]

