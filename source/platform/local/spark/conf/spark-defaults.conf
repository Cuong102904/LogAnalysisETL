spark.sql.session.timeZone                        UTC
spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled                        true
spark.sql.shuffle.partitions                      32

spark.jars.ivy                                    /opt/bitnami/spark/.ivy2
spark.sql.extensions                              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                   org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.schema.autoMerge.enabled   true

spark.jars.packages                               io.openlineage:openlineage-spark_2.12:1.50.0
spark.extraListeners                              io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.namespace                       learnlake-local
spark.openlineage.transport.type                  http
spark.openlineage.transport.url                   http://marquez-api:5000

spark.hadoop.fs.s3a.endpoint                      http://minio:9000
spark.hadoop.fs.s3a.path.style.access             true
spark.hadoop.fs.s3a.connection.ssl.enabled        false
spark.hadoop.fs.s3a.aws.credentials.provider      org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

spark.eventLog.enabled                            true
spark.eventLog.dir                                s3a://platform/spark-events/logs
spark.history.fs.logDirectory                     s3a://platform/spark-events/logs
spark.history.ui.port                             18080
spark.history.fs.update.interval                  10s

spark.executorEnv.PYTHONPATH                      /opt/project/src:/opt/project
spark.executorEnv.PYSPARK_PYTHON                  /opt/bitnami/python/bin/python
spark.pyspark.python                              /opt/bitnami/python/bin/python
spark.pyspark.driver.python                       /opt/bitnami/python/bin/python
spark.driver.extraJavaOptions                     -Duser.timezone=UTC
spark.executor.extraJavaOptions                   -Duser.timezone=UTC
