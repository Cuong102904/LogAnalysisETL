# Silver label policy (silver_class column). Runtime logic: spark/domain/silver/classifier.py
# Allowed values: learning, performance, system, product, navigation, unknown
#
# Unknown normalizer intentionally includes silver_class unknown|product|navigation so wide-capture rows
# are not dropped from the silver transformer (see spark/domain/silver/normalizers/unknown.py).
#
version: 1
silver_classes:
  - learning
  - performance
  - system
  - product
  - navigation
  - unknown
