version: "2026-07-02"

defaults:
  match_mode: first_match_wins
  canonical_target: events_canonical
  unknown_target: silver_unknown_events
  invalid_target: silver_invalid_events

routes:
  - id: browser_problem_check
    priority: 100
    description: Browser-side problem submission events
    family: problem_browser
    match:
      all:
        - field: event_source
          op: in
          values: ["browser"]
        - field: event_type
          op: in
          values: ["problem_check"]
    classify:
      event_group: assessment
      event_subgroup: problem_submission
      parser_family: problem_browser
      is_noise: false
    targets:
      canonical: true
      domain: ["problem_submissions"]
    parser: parse_problem_check_browser

  - id: server_problem_check
    priority: 95
    description: Server-side problem submission events
    family: problem_server
    match:
      all:
        - field: event_source
          op: in
          values: ["server"]
        - field: event_type
          op: in
          values: ["problem_check"]
    classify:
      event_group: assessment
      event_subgroup: problem_submission
      parser_family: problem_server
      is_noise: false
    targets:
      canonical: true
      domain: ["problem_submissions"]
    parser: parse_problem_check_server

  - id: server_problem_grade
    priority: 90
    description: Persisted grading events
    family: grade_server
    match:
      all:
        - field: event_type
          op: in
          values: ["edx.grades.problem.submitted", "problem_graded"]
    classify:
      event_group: assessment
      event_subgroup: problem_grade
      parser_family: grade_server
      is_noise: false
    targets:
      canonical: true
      domain: ["problem_grades"]
    parser: parse_problem_grade

  - id: special_exam_attempt
    priority: 85
    description: Special exam lifecycle events
    family: special_exam
    match:
      all:
        - field: event_type
          op: regex
          value: "^edx\\.special_exam\\.timed\\.attempt\\.(created|started|submitted|ready_to_submit)$"
    classify:
      event_group: exam
      event_subgroup: exam_attempt
      parser_family: special_exam
      is_noise: false
    targets:
      canonical: true
      domain: ["exam_attempts"]
    parser: parse_special_exam_attempt

  - id: video_interaction
    priority: 80
    description: Browser video interactions
    family: video_browser
    match:
      all:
        - field: event_type
          op: in
          values: ["load_video", "play_video", "pause_video", "seek_video", "speed_change_video", "stop_video"]
    classify:
      event_group: video
      event_subgroup: interaction
      parser_family: video_browser
      is_noise: false
    targets:
      canonical: true
      domain: ["video_interactions"]
    parser: parse_video_interaction

  - id: transcript_request
    priority: 75
    description: Video transcript requests
    family: transcript_request
    match:
      any:
        - field: context_path
          op: regex
          value: "/handler/transcript/"
        - field: event_type
          op: in
          values: ["transcript_download", "transcript_request"]
    classify:
      event_group: video
      event_subgroup: transcript
      parser_family: transcript_request
      is_noise: false
    targets:
      canonical: true
      domain: []
    parser: parse_transcript_request

  - id: navigation_event
    priority: 70
    description: Navigation and sequence events
    family: navigation
    match:
      any:
        - field: event_type
          op: in
          values: ["seq_goto", "seq_next", "goto_position", "get_completion"]
        - field: event_type
          op: regex
          value: "^/courses/.*/handler/xmodule_handler/(goto_position|get_completion)$"
        - field: event_name
          op: in
          values: ["edx.ui.lms.sequence.next_selected", "edx.ui.lms.sequence.tab_selected", "link_clicked", "edx.ui.lms.link_clicked"]
    classify:
      event_group: navigation
      event_subgroup: flow
      parser_family: navigation
      is_noise: false
    targets:
      canonical: true
      domain: ["navigation_events"]
    parser: parse_navigation_event

  - id: pdf_book_access
    priority: 65
    description: Book and PDF content access
    family: pdf_book
    match:
      any:
        - field: event_type
          op: in
          values: ["book", "textbook.pdf.page.scrolled"]
    classify:
      event_group: learning
      event_subgroup: content_access
      parser_family: pdf_book
      is_noise: false
    targets:
      canonical: true
      domain: ["content_access_events"]
    parser: parse_content_access_event

  - id: auth_noise
    priority: 20
    description: Authentication callbacks and unauthenticated auth requests
    family: auth
    match:
      any:
        - field: context_path
          op: regex
          value: "/auth/|/login|/logout|/callback"
        - field: event_type
          op: regex
          value: "^/(auth/|login|logout|register|user_api/)"
    classify:
      event_group: system
      event_subgroup: auth
      parser_family: auth
      is_noise: true
    targets:
      canonical: true
      domain: ["system_noise_events"]
    parser: parse_auth_noise_event

  - id: path_noise
    priority: 10
    description: Bot scanners and noise paths
    family: noise_path
    match:
      any:
        - field: context_path
          op: regex
          value: "/\\.env|wp-admin|phpmyadmin|boaform|cgi-bin|robots\\.txt|xmlrpc\\.php"
        - field: event_type
          op: regex
          value: "/\\.env|wp-admin|phpmyadmin|boaform|cgi-bin|robots\\.txt|xmlrpc\\.php"
        - field: agent
          op: regex
          value: "(?i)(bot|crawler|spider|scan|curl|wget)"
    classify:
      event_group: noise
      event_subgroup: path_scan
      parser_family: noise_path
      is_noise: true
    targets:
      canonical: true
      domain: ["system_noise_events"]
    parser: parse_system_noise_event
