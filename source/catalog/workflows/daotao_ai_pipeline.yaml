workflow_id: daotao_ai_pipeline
source_id: daotao_ai
tasks:
  - task_id: bronze_ingest
    runner: spark
    entrypoint: apps/spark/run_bronze.py
    args:
      - --source
      - daotao_ai
  - task_id: silver_normalize
    runner: spark
    entrypoint: apps/spark/run_silver.py
    after:
      - bronze_ingest
    args:
      - --source
      - daotao_ai
  - task_id: gold_assessment_stream
    runner: spark
    entrypoint: apps/spark/run_gold_assessment_stream.py
    after:
      - silver_normalize
  - task_id: gold_assessment_batch
    runner: spark
    entrypoint: apps/spark/run_gold_assessment_batch.py
    after:
      - silver_normalize
  - task_id: gold_exam_ops_stream
    runner: spark
    entrypoint: apps/spark/run_gold_exam_ops_stream.py
    after:
      - silver_normalize
  - task_id: delta_maintenance
    runner: spark
    entrypoint: apps/maintenance/delta_maintenance.py
    after:
      - silver_normalize
    priority: 500
    args:
      - --table-path
      - s3a://lakehouse/learnlake/silver/events_canonical
      - --app-name
      - events_canonical_maintenance
      - --optimize
