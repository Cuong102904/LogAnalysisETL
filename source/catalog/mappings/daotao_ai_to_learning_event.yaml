source_id: daotao_ai
target: silver_event_index
event_type_map: catalog/event_types/edx_tracking_log.yaml

fields:
  event_id:
    path: bronze.event_id
    cast: string
  source_id:
    path: bronze.source_id
    cast: string
  source_type:
    path: bronze.source_type
    cast: string
  raw_event_ref:
    path: bronze.event_id
    cast: string
  event_time:
    path: bronze.event_time
    cast: timestamp
  ingest_time:
    path: bronze.ingestion_time
    cast: timestamp
  actor_id:
    coalesce:
      - path: raw_payload.context.user_id
        cast: string
      - path: raw_payload.username
        cast: string
  actor_external_id:
    path: raw_payload.username
    cast: string
  session_id:
    path: raw_payload.session
    cast: string
  course_id:
    path: raw_payload.context.course_id
    cast: string
  org_id:
    path: raw_payload.context.org_id
    cast: string
  raw_name:
    coalesce:
      - path: raw_payload.name
        cast: string
      - path: raw_payload.event_type
        cast: string
  raw_event_type:
    path: raw_payload.event_type
    cast: string
  event_source:
    path: raw_payload.event_source
    cast: string
  event_group:
    path: route.event_group
    cast: string
  normalized_type:
    path: route.normalized_type
    cast: string
  action:
    path: route.action
    cast: string
  object_type:
    path: route.object_type
    cast: string
  object_id:
    plugin:
      name: daotao_extract_object_id
      inputs:
        - path: raw_payload.context.path
        - path: raw_payload.event_type
  learning_relevance:
    path: route.learning_relevance
    cast: string
  path:
    path: raw_payload.context.path
    cast: string
  page:
    path: raw_payload.page
    cast: string
  referer:
    path: raw_payload.referer
    cast: string
  host:
    path: raw_payload.host
    cast: string
  ip:
    path: raw_payload.ip
    cast: string
  user_agent:
    path: raw_payload.agent
    cast: string
  is_authenticated:
    plugin:
      name: daotao_is_authenticated
      inputs:
        - path: raw_payload.username
        - path: raw_payload.context.user_id
  is_bot:
    plugin:
      name: daotao_is_bot
      inputs:
        - path: raw_payload.agent
        - path: raw_payload.username
        - path: raw_payload.event_type
  is_noise:
    path: route.is_noise
    cast: boolean
  payload_kind:
    path: parsed_payload.kind
    cast: string
  payload_json:
    plugin:
      name: daotao_payload_json_dict
      inputs:
        - path: parsed_payload.data
  context:
    path: raw_payload.context
