source_id: daotao_ai
source_type: edx_tracking_log
domain: mooc

input:
  mode: kafka
  format: jsonl
  path: /home/amira/Desktop/DEV/theinfitech/LogAnalysisETL/data_filter/BK_activity_logs/normal_days
  topic: mooc.raw.events
  bootstrap_servers: broker1:29092,broker2:29092,broker3:29092
  starting_offsets: earliest
  max_offsets_per_trigger: 100000
  event_time_field: time
  event_type_field: event_type

bronze:
  table: bronze_events
  path: s3a://lakehouse/learnlake/bronze/bronze_events
  checkpoint: s3a://platform/learnlake/checkpoints/bronze/daotao_ai
  partition_by:
    - source_id
    - processing_date

silver:
  runtime:
    checkpoint: s3a://platform/learnlake/checkpoints/silver/daotao_ai/runtime
    trigger_processing_time: 5 minutes
    max_files_per_trigger: 100000
  canonical:
    table: events_canonical
    path: s3a://lakehouse/learnlake/silver/events_canonical
    partition_by:
      - event_date
      - course_id
  unknown:
    table: silver_unknown_events
    path: s3a://lakehouse/learnlake/silver/silver_unknown_events
    partition_by:
      - event_date
      - replay_status
  invalid:
    table: silver_invalid_events
    path: s3a://lakehouse/learnlake/silver/silver_invalid_events
    partition_by:
      - course_id
  targets:
    problem_submissions:
      table: problem_submissions
      path: s3a://lakehouse/learnlake/silver/problem_submissions
      partition_by:
        - course_id
    problem_grades:
      table: problem_grades
      path: s3a://lakehouse/learnlake/silver/problem_grades
      partition_by:
        - course_id
    exam_attempts:
      table: exam_attempts
      path: s3a://lakehouse/learnlake/silver/exam_attempts
      partition_by:
        - course_id
    video_interactions:
      table: video_interactions
      path: s3a://lakehouse/learnlake/silver/video_interactions
      partition_by:
        - course_id
    navigation_events:
      table: navigation_events
      path: s3a://lakehouse/learnlake/silver/navigation_events
      partition_by:
        - course_id
    content_access_events:
      table: content_access_events
      path: s3a://lakehouse/learnlake/silver/content_access_events
      partition_by:
        - course_id
    system_noise_events:
      table: system_noise_events
      path: s3a://lakehouse/learnlake/silver/system_noise_events
      partition_by:
        - event_time_utc
  routing: projects/daotao_ai/routing.yaml
  parsers: projects/daotao_ai/parsers.yaml
  quality_rules:
    - catalog/quality/common_learning_event_rules.yaml
    - catalog/quality/daotao_ai_rules.yaml

workflows:
  - catalog/workflows/daotao_ai_pipeline.yaml
